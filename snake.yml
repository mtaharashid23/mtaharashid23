# Path: .github/workflows/snake.yml  (repo: mtaharashid23/mtaharashid23)
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at 00:00 UTC
  workflow_dispatch:        # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation (monochrome, matches portfolio)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0C0C0D&color_dots=#EBEBE9,#C4C4C8,#8B8B90,#4A4A4F,#18181B
            dist/snake-dark.svg?color_snake=#F4F4F2&color_dots=#161618,#2E2E32,#55555B,#8B8B90,#C4C4C8

      - name: Push snake output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
